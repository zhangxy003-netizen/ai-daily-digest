name: Daily AI Digest

on:
  schedule:
    # 每天 UTC 00:30 运行(北京时间 08:30)。cron 用 UTC。
    - cron: "30 0 * * *"
  workflow_dispatch:   # 也允许在 Actions 页面手动触发

permissions:
  contents: write       # 允许把更新后的 feed.json 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch sources
        run: python scripts/fetch_sources.py

      - name: Select top papers (AI scoring)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/rank_papers.py

      - name: Generate explanations
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/explain.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/raw.json data/selected.json data/issues.json data/archive/
          if git diff --staged --quiet; then
            echo "今日无更新"
          else
            git commit -m "chore: daily digest $(date -u +%Y-%m-%d)"
            # 推送前先同步远端最新,避免与手动修改冲突;失败则重试几次
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "推送冲突,第 $i 次重试…"
              sleep 3
            done
          fi
