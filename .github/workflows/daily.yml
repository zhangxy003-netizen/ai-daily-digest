name: Daily AI Digest

on:
  schedule:
    # 避开 UTC 整点/半点。UTC 22:37 = 北京时间 06:37,冷门时段,延迟通常更小。
    # 注意:GitHub 定时任务在高峰期可能延迟数小时,这不影响内容,只影响更新时刻。
    - cron: "37 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "回填指定日期(YYYY-MM-DD),留空则跑今天"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIGEST_DATE: ${{ github.event.inputs.date }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch sources
        run: python scripts/fetch_sources.py

      - name: Select top papers (AI scoring)
        run: python scripts/rank_papers.py

      - name: Generate explanations
        # explain.py 在成功条数低于门槛时会 exit 1,让这一步变红并触发邮件通知
        run: python scripts/explain.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/raw.json data/selected.json data/issues.json data/archive/
          if git diff --staged --quiet; then
            echo "今日无更新"
            exit 0
          fi
          git commit -m "chore: digest ${DIGEST_DATE:-$(date -u +%Y-%m-%d)}"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              ok=1; break
            fi
            echo "推送失败,第 $i 次重试…"
            sleep 5
          done
          # 三次都失败必须让步骤变红,不能再静默吞掉
          if [ "$ok" != "1" ]; then
            echo "::error::推送失败三次,本次结果未上线"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### 本次运行" >> $GITHUB_STEP_SUMMARY
          python - <<'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          p = pathlib.Path("data/feed.json")
          if p.exists():
              f = json.loads(p.read_text(encoding="utf-8"))
              m = f.get("run_meta", {})
              print(f"- 最新一期:第 {f.get('issue_no')} 期({f.get('updated_at')}),{len(f.get('items', []))} 条")
              if m:
                  print(f"- 解读成功 {m.get('explained')}/{m.get('selected')},模型 {m.get('models_used')},耗时 {m.get('duration_s')}s")
                  for x in m.get("failed", []):
                      print(f"  - 失败:{x['title']} — {' | '.join(x['reasons'])}")
          PYEOF
